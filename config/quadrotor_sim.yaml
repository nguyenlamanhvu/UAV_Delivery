model: UAV_models/skydio_2/quadrotor.urdf
motor_type: racing_2207

plant:
  mass: 0.770
  gravity: 9.81
  arm_length: 0.15
  thrust_coeff: 1.0
  yaw_moment_coeff: 1.0e-2
  max_rotor_input: 5.0
  inertia: [0.0015, 0.0025, 0.0035]

initial_state:
  position: [0.0, 0.0, 1.0]
  rpy: [0.0, 0.0, 0.0]
  velocity: [0.0, 0.0, 0.0]
  body_angular_velocity: [0.0, 0.0, 0.0]

lcm_channels:
  command: UAV_QUADROTOR_COMMAND
  state: UAV_QUADROTOR_STATE
  reference: UAV_QUADROTOR_REFERENCE
  reference_trajectory: UAV_QUADROTOR_REFERENCE_TRAJECTORY
  sim_time: UAV_SIM_TIME
  setpoint: UAV_QUADROTOR_SETPOINT

se3_controller:
  desired_position: [0.0, 0.0, 1.0]
  desired_velocity: [0.0, 0.0, 0.0]
  desired_yaw: 0.0
  kp_position: 4.0
  kd_position: 3.0
  kp_rotation: 1.5
  kd_angular: 0.3
  max_velocity: 3.0
  kv_velocity: [3.4, 3.4, 3.4]
  ki_velocity: [0.0, 0.0, 0.0]
  aerodynamic_drag: [0.15, 0.15, 0.0]
  k_rp: [6.0, 6.0, 0.0]
  k_yaw: 1.5
  k_omega: [0.045, 0.075, 0.035]
  observer_gain: 8.0
  observer_force_gain: 4.0
  max_observer_force: 8.0
  max_integral_speed: 6.0

trajectory:
  publish_rate: 10.0
  preview_horizon: 20
  preview_dt: 0.001
  waypoints:
    - time: 0.0
      position: [0.0, 0.0, 1.0]
      yaw: 0.0
    - time: 5.0
      position: [1.0, 0.0, 1.0]
      yaw: 0.0
    - time: 10.0
      position: [1.0, 1.0, 1.0]
      yaw: 0.0

publish_rate: 100.0
realtime_rate: 1.0
sim_time: 999999.0
console_log: true
console_period: 0.25
