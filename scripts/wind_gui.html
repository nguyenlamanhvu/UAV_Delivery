<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel-title {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        /* Video Area (Top Left) */
        #video-panel {
            grid-column: 1;
            grid-row: 1;
        }
        #video-container {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        /* Wind Controller (Top Right) */
        #wind-panel {
            grid-column: 2;
            grid-row: 1;
        }
        .wind-joystick-box {
            position: relative;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        /* Flight Joysticks (Bottom Full Width) */
        #flight-panel {
            grid-column: 1 / -1;
            grid-row: 2;
            flex-direction: row;
            justify-content: space-around;
        }
        
        .flight-joystick-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .flight-joystick-box {
            position: relative;
            width: 250px;
            height: 250px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Universal Sliders */
        .slider-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .val-display { color: var(--accent); font-family: monospace; }
        
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 20px; width: 20px; border-radius: 50%; background: var(--bg-color);
            border: 2px solid var(--accent); cursor: pointer; -webkit-appearance: none;
            margin-top: -6px;
        }
    </style>
</head>
<body>

    <h1>Ultimate Command Center</h1>

    <div class="dashboard">
        
        <!-- Left: Camera -->
        <div class="panel" id="video-panel">
            <div class="panel-title">Drone First-Person View</div>
            <div id="video-container">
                <img src="/video_feed" style="width: 100%; height: auto; display: block;">
            </div>
        </div>

        <!-- Right: Wind Control -->
        <div class="panel" id="wind-panel">
            <div class="panel-title">Weather Control</div>
            <div class="wind-joystick-box" id="wind-joy"></div>
            
            <div class="slider-group">
                <div class="slider-header"><span>Gust Severity (σ)</span> <span class="val-display" id="val-sigma">0.0</span></div>
                <input type="range" id="sl-sigma" min="0" max="10" step="0.1" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Altitude (m)</span> <span class="val-display" id="val-alt">0.0</span></div>
                <input type="range" id="sl-alt" min="0" max="100" step="1" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Drag Coeff</span> <span class="val-display" id="val-drag">0.0</span></div>
                <input type="range" id="sl-drag" min="0" max="2" step="0.05" value="0">
            </div>
        </div>

        <!-- Bottom: Flight Control & Gimbal -->
        <div class="panel" id="flight-panel">
            <div class="flight-joystick-wrapper">
                <div class="panel-title" style="border:none">Throttle & Yaw</div>
                <div class="flight-joystick-box" id="left-joy"></div>
            </div>
            
            <div class="flight-joystick-wrapper" style="width: 300px;">
                <div class="panel-title" style="border:none">Camera Gimbal</div>
                <div class="slider-group" style="margin-top: 50px;">
                    <div class="slider-header"><span>Pitch (down)</span> <span class="val-display" id="val-campitch">0.0</span></div>
                    <input type="range" id="sl-campitch" min="-1.57" max="0.0" step="0.01" value="0.0">
                </div>
            </div>

            <div class="flight-joystick-wrapper">
                <div class="panel-title" style="border:none">Pitch & Roll</div>
                <div class="flight-joystick-box" id="right-joy"></div>
            </div>
        </div>

    </div>

    <script>
        // State
        const wState = { nominal_x: 0, nominal_y: 0, sigma: 0, altitude: 0, drag_coeff: 0 };
        const fState = { throttle: 0, yaw: 0, pitch: 0, roll: 0, camera_pitch: 0 };

        // Wind Joystick
        const wJoy = nipplejs.create({ zone: document.getElementById('wind-joy'), mode: 'static', position: {left:'50%', top:'50%'}, color: '#8b5cf6' });
        wJoy.on('move', (e, d) => {
            const spd = (d.distance / 100.0) * 15.0;
            wState.nominal_x = Math.cos(d.angle.radian) * spd;
            wState.nominal_y = Math.sin(d.angle.radian) * spd;
            sendWind();
        });
        wJoy.on('end', () => { wState.nominal_x = 0; wState.nominal_y = 0; sendWind(); });

        // Flight Joysticks
        const lJoy = nipplejs.create({ zone: document.getElementById('left-joy'), mode: 'static', position: {left:'50%', top:'50%'}, color: '#22c55e' });
        lJoy.on('move', (e, d) => { fState.yaw = d.vector.x; fState.throttle = d.vector.y; });
        lJoy.on('end', () => { fState.yaw = 0; fState.throttle = 0; });

        const rJoy = nipplejs.create({ zone: document.getElementById('right-joy'), mode: 'static', position: {left:'50%', top:'50%'}, color: '#38bdf8' });
        rJoy.on('move', (e, d) => { fState.roll = d.vector.x; fState.pitch = d.vector.y; });
        rJoy.on('end', () => { fState.roll = 0; fState.pitch = 0; });

        // Sliders
        const bindSlider = (id, obj, key, valId) => {
            document.getElementById(id).addEventListener('input', (e) => {
                obj[key] = parseFloat(e.target.value);
                document.getElementById(valId).innerText = obj[key].toFixed(2);
                if(obj === wState) sendWind();
            });
        };
        bindSlider('sl-sigma', wState, 'sigma', 'val-sigma');
        bindSlider('sl-alt', wState, 'altitude', 'val-alt');
        bindSlider('sl-drag', wState, 'drag_coeff', 'val-drag');
        bindSlider('sl-campitch', fState, 'camera_pitch', 'val-campitch');

        // Comms
        let wTimeout = null;
        function sendWind() {
            if(wTimeout) clearTimeout(wTimeout);
            wTimeout = setTimeout(() => {
                fetch('/update_wind', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(wState) });
            }, 50);
        }

        let isFetchingCommand = false;
        setInterval(() => {
            if (isFetchingCommand) return;
            isFetchingCommand = true;
            fetch('/command', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(fState) })
            .finally(() => { isFetchingCommand = false; });
        }, 50);
    </script>
</body>
</html>
